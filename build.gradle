plugins {
    id 'fabric-loom' version '1.14-SNAPSHOT'
    id 'maven-publish'
}

// ============================================================
// Multi-version build
// ------------------------------------------------------------
// The target Minecraft version is selected with -PmcVersion=<id>
// (default: gradle.properties -> mcVersion). Each <id> maps to a
// properties file under versions/<id>.properties that pins the
// exact Minecraft / yarn / loader / fabric-api versions and the
// code variants to use (mixin_variant + widget_variant).
//
// Rendering eras of DrawContext:
//   legacy  <=1.21.1  drawTexture(Identifier, ...) with setShaderColor
//   middle  1.21.2+   drawTexture(Function<Identifier, RenderLayer>, ...)
//   modern  1.21.6+   drawTexture(RenderPipeline, ...)
// Widget click handling:
//   legacy  <=1.21.8  onClick(double, double)
//   modern  1.21.10+  onClick(Click, boolean)
//
// minecraft_version_range values use Fabric loader version-predicate syntax
// (e.g. ">=1.21.2 <1.21.6", space-separated terms are ANDed). Do NOT use
// Modrinth-style [a,b) bracket ranges: the loader silently never matches them.
// ============================================================
def mcVersionId = providers.gradleProperty('mcVersion').get()
def versionProps = new Properties()
def versionFile = file("versions/${mcVersionId}.properties")
if (!versionFile.isFile()) {
    throw new GradleException(
        "Unknown mcVersion '${mcVersionId}'. Expected a file versions/${mcVersionId}.properties " +
        "(e.g. -PmcVersion=1.21.1). Supported ids: " +
        fileTree('versions').files.name.collect { it.replace('.properties', '') }.sort().join(', '))
}
versionFile.withInputStream { versionProps.load(it) }

def mcVersion = versionProps.getProperty('minecraft_version')
def yarnMappings = versionProps.getProperty('yarn_mappings')
def loaderVersion = versionProps.getProperty('loader_version')
def fabricVersion = versionProps.getProperty('fabric_version')
def mcVersionRange = versionProps.getProperty('minecraft_version_range')
def mixinVariant = versionProps.getProperty('mixin_variant', 'modern')
def widgetVariant = versionProps.getProperty('widget_variant', 'modern')
def targetJavaVersion = Integer.parseInt(versionProps.getProperty('java_release', '21'))

// Version-specific classes live in per-variant source dirs (src/mixin-<v>,
// src/widget-<v>); everything else lives in src/shared. The active variants
// are chosen by swapping the source dirs.
def mainJavaDirs = ['src/shared/java', "src/mixin-${mixinVariant}/java", "src/widget-${widgetVariant}/java"]
def mainResourceDirs = ['src/shared/resources']
sourceSets.main.java.setSrcDirs(mainJavaDirs)
sourceSets.main.resources.setSrcDirs(mainResourceDirs)

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}


repositories {
    // Add repositories to retrieve artifacts from in here.
    // You should only use this when depending on other mods because
    // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html
    // for more information about repositories.
    flatDir {
        dirs 'libs'
    }
}

dependencies {
    // To change the versions see the versions/ folder and gradle.properties
    minecraft "com.mojang:minecraft:${mcVersion}"
    mappings "net.fabricmc:yarn:${yarnMappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${loaderVersion}"
    // Fabric API. This is technically optional, but you probably want it anyway.
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabricVersion}"

}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", mcVersion
    inputs.property "minecraft_version_range", mcVersionRange
    inputs.property "loader_version", loaderVersion
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": mcVersion,
                "minecraft_version_range": mcVersionRange,
                "loader_version": loaderVersion
    }

    filesMatching("quilt.mod.json") {
        expand "version": project.version,
                "minecraft_version_range": mcVersionRange
    }
}

tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}

loom {
    // No code accesses the widened members anymore; a header-only widener
    // is valid on every supported version.
    accessWidenerPath = file('src/shared/resources/animated-logo.accesswidener')
}
